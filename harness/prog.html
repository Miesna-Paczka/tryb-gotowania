<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>PRÓG 500/501 px — tryb gotowania</title>

<!--
  harness/prog.html — powierzchnia progu (wiersze matrycy G07 i H8).
  WYMAGANIA §1 (v1.8): przycisk wejścia w tryb gotowania jest widoczny do 500 px
  WŁĄCZNIE i ukryty od 501 px w górę — D-35.1 rozstrzygnięte przez operatora
  2026-08-15, definitywnie. Do v1.7 stało tu 499/500. To zachowanie STRONY, nie overlaya,
  więc mierzy się je po obu stronach progu, a nie w matrycy szerokości.
  Wynik przychodzi z `fixture.html` w polu `startWidoczny`.
-->

<style>
  :root{--tlo:#12100e;--ok:#3ddc84;--zle:#ff6b5e}
  html,body{margin:0;background:var(--tlo);color:#eee;
            font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:10px 14px;background:#1c1915;border-bottom:1px solid #333}
  .ok{color:var(--ok)} .zle{color:var(--zle)}
  .rzad{display:flex;gap:14px;padding:14px;overflow-x:auto}
  .etykieta{padding:0 0 4px;font-size:12px;color:#aaa}
  iframe{border:1px solid #444;background:#fff;display:block}
</style>
</head>
<body>

<header><b>PRÓG 500/501 px</b> — <span id="podsumowanie">ładowanie…</span></header>
<div class="rzad" id="rzad"></div>

<script>
/* oczekiwanie: 500 → przycisk WIDOCZNY, 501 → UKRYTY (D-35.1, 2026-08-15).
   Ramka 499 zostaje jako kontrola dodatnia: gdyby ktoś przesunął próg o więcej
   niż jeden piksel, sam przemiar 500/501 by tego nie zobaczył. */
var RAMKI = [
  { nazwa: '499', w: 499, ocz: true },
  { nazwa: '500', w: 500, ocz: true },
  { nazwa: '501', w: 501, ocz: false }
];
var wyniki = Object.create(null);
window.MP_PROG = { wyniki: wyniki, gotowe: false };

RAMKI.forEach(function (r) {
  var kom = document.createElement('div');
  kom.innerHTML = '<div class="etykieta" id="et-' + r.nazwa + '">' + r.w +
                  ' px · oczekiwany przycisk: ' + (r.ocz ? 'WIDOCZNY' : 'UKRYTY') +
                  ' · <span class="stan">…</span></div>';
  var f = document.createElement('iframe');
  f.src = 'fixture.html'; f.name = r.nazwa; f.width = r.w; f.height = 620;
  f.setAttribute('title', 'fixture ' + r.nazwa);
  kom.appendChild(f);
  document.getElementById('rzad').appendChild(kom);
  f.addEventListener('load', function () {
    skalibruj(f, r.w, function (ok, szer) {
      r.skalibrowana = ok; r.szerRamki = szer;
      var w2 = f.contentWindow;
      /* Po kalibracji pytamy ŹRÓDŁO PRAWDY o widoczność jeszcze raz — stan z `message`
         mógł powstać przed kalibracją, przy innej szerokości. */
      var b2 = f.contentDocument && f.contentDocument.getElementById('mp-start');
      var widoczny = b2 ? w2.getComputedStyle(b2).display !== 'none' : null;
      wyniki[r.nazwa] = {
        startWidoczny: widoczny,
        zgodne: widoczny === r.ocz,
        skalibrowana: ok,
        mqDol: w2.matchMedia('(min-width:' + r.w + 'px)').matches,
        mqGora: w2.matchMedia('(min-width:' + (r.w + 1) + 'px)').matches
      };
      var gotoweWszystkie = RAMKI.every(function (x) { return wyniki[x.nazwa]; });
      if (gotoweWszystkie) {
        window.MP_PROG.gotowe = true;
        window.MP_PROG.ok = RAMKI.every(function (x) {
          return wyniki[x.nazwa].zgodne && wyniki[x.nazwa].skalibrowana;
        });
      }
    });
  });
});

/* KALIBRACJA SZEROKOŚCI RAMKI (2026-08-15) — `innerWidth` KŁAMIE o ułamek piksela.
   Zmierzone: ramka o atrybucie `width=501` raportuje `innerWidth === 501`, a jednocześnie
   `matchMedia('(min-width:501px)').matches === false` i `(min-width:500px)` === true.
   Czyli realna szerokość widoku to ~500,x px, `innerWidth` ją ZAOKRĄGLA w górę, a media
   query liczy z pełną precyzją. Pomiar progu oparty na `innerWidth` mierzył więc coś
   innego, niż deklarował — i przy progu przesuniętym o JEDEN piksel to wystarcza,
   żeby wynik był odwrotny.
   Kalibrujemy tak, żeby widok ramki wpadł w przedział [W, W+1): `(min-width:Wpx)`
   ma być prawdą, a `(min-width:(W+1)px)` fałszem. Bez tego 501 wychodzi „widoczny",
   choć reguła jest poprawna. Ta sama rodzina co kalibracja triku same-origin
   na stagingu (przeb. 38). */
function skalibruj(f, docelowa, gotowe) {
  var proby = 0;
  (function krok() {
    var w = f.contentWindow;
    if (!w || !w.matchMedia) { if (++proby < 60) return setTimeout(krok, 30); return gotowe(false, null); }
    var wDol = w.matchMedia('(min-width:' + docelowa + 'px)').matches;
    var wGora = w.matchMedia('(min-width:' + (docelowa + 1) + 'px)').matches;
    if (wDol && !wGora) return gotowe(true, f.offsetWidth);
    if (++proby > 40) return gotowe(false, f.offsetWidth);
    f.width = parseInt(f.width, 10) + (wDol ? -1 : 1);
    setTimeout(krok, 30);
  })();
}

window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || !d.mpHarness) return;
  var r = RAMKI.filter(function (x) { return x.nazwa === d.nazwa; })[0];
  if (!r) return;
  var zgodne = d.mpHarness.startWidoczny === r.ocz;
  wyniki[r.nazwa] = { startWidoczny: d.mpHarness.startWidoczny, zgodne: zgodne, ok: d.mpHarness.ok };

  var s = document.querySelector('#et-' + r.nazwa + ' .stan');
  s.textContent = (zgodne ? 'OK' : 'BŁĄD — jest ' + (d.mpHarness.startWidoczny ? 'WIDOCZNY' : 'UKRYTY'));
  s.className = 'stan ' + (zgodne ? 'ok' : 'zle');

  var klucze = Object.keys(wyniki);
  var zle = klucze.filter(function (k) { return !wyniki[k].zgodne; });
  var el = document.getElementById('podsumowanie');
  el.textContent = (klucze.length - zle.length) + '/' + RAMKI.length + ' zgodnych' +
                   (klucze.length === RAMKI.length ? '' : ' · czekam');
  el.className = (klucze.length === RAMKI.length && !zle.length) ? 'ok' : (zle.length ? 'zle' : '');
  window.MP_PROG.gotowe = klucze.length === RAMKI.length;
});
</script>
</body>
</html>
